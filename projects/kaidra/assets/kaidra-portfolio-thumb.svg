<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Kaidra identity visibility dashboard concept</title>
  <desc id="desc">A clean blue and mint interface mockup showing identity visibility metrics and access activity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091326"/>
      <stop offset="1" stop-color="#183f68"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d8bc"/>
      <stop offset="1" stop-color="#9af0d8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="240" fill="#2e6bf0" opacity=".2"/>
