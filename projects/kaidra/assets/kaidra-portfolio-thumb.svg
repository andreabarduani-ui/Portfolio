  <text x="140" y="367" fill="#173453" font-family="Arial,sans-serif" font-size="38" font-weight="700">12,482</text>
  <text x="462" y="315" fill="#58718b" font-family="Arial,sans-serif" font-size="16">Active reviews</text>
  <text x="462" y="367" fill="#173453" font-family="Arial,sans-serif" font-size="38" font-weight="700">05</text>
