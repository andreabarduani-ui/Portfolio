  <text x="144" y="229" fill="#5ea3d8" font-family="Arial,sans-serif" font-size="21" font-weight="700">See what matters. Act with confidence.</text>
  <rect x="112" y="278" width="300" height="132" rx="14" fill="#eef7f5"/>
