[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Critical safety net only (pyflakes + syntax errors): legacy tools keep
# their proven style (single-line ifs, semicolons), so E7 is out.
# Known non-critical F findings in the legacy tools are ignored per-file
# (proven field logic untouched; imports/placeholders kept as-is).
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"projects/elearning-hours-monitor/elearning_hours_monitor.py" = ["F401", "F841", "F541"]
"projects/funding-call-scraper/funding_calls_scraper.py" = ["F401", "F841", "F541"]
"projects/regulation-search/regulation_search.py" = ["F401", "F841", "F541"]
"projects/apprenticeship-quote-generator/apprenticeship_quote_generator.py" = ["F401", "F841", "F541"]
"projects/attendance-register-filler/attendance_register_filler.py" = ["F401", "F841", "F541"]
"projects/certificate-manager/certificate_manager.py" = ["F401", "F841", "F541"]
"projects/financial-plan-builder/*.py" = ["F401", "F841", "F541"]
"projects/timesheet-generator/timesheet_generator.py" = ["F401", "F841", "F541"]
"projects/transparency-certificates/transparency_certificates.py" = ["F401", "F841", "F541"]
"projects/tutoring-hours-distributor/tutoring_hours_distributor.py" = ["F401", "F841", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
