<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <!-- Sorgente editoriale per og-cover.png — sfondo chiaro sito #fdfcf9, nessun effetto neon/AI -->
  <rect width="1200" height="627" fill="#fdfcf9"/>
  <g fill="#e4e0d8">
    <!-- griglia puntinata discreta generata via pattern -->
    <defs>
      <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse" x="44" y="32">
        <circle cx="2" cy="2" r="1.4" fill="#e4e0d8"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="1200" height="627" fill="url(#dots)"/>
  </g>
  <rect x="1" y="1" width="1198" height="625" fill="none" stroke="#e4e0d8" stroke-width="2"/>
  <rect x="19" y="19" width="1162" height="589" fill="none" stroke="#e4e0d8" stroke-width="1"/>
  <text x="600" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="8" fill="#5c574f">ANDREA BARDUANI</text>
  <text x="600" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="148" fill="#26231f">Portfolio</text>
  <rect x="564" y="392" width="72" height="3" fill="#0d5794"/>
  <text x="600" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0d5794">Software · Web · AI-Driven Data Analytics</text>
  <text x="600" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="1" fill="#5c574f">18 projects · 5,000 companies · 260 countries</text>
</svg>
